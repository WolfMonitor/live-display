
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Griechischer Abend – Live Dance Display</title>

<style>
  :root {
    --white: rgba(255, 255, 255, 0.96);
    --blue: #075b9e;
    --dark-blue: #063b70;
    --gold: #d9b36b;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #075b9e;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 0 3vw 3vh;

    background-image:
      url("https://static.wixstatic.com/media/266187_605edf485a4041b38f1b19a0357f76f3~mv2.png");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  /*
   * Oberer Bereich für den Veranstaltungstitel
   * und die Griechenland-Landschaft.
   */

  .top-space {
    width: 100%;
    flex: 0 0 48%;
    min-height: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 3vh;
    text-align: center;
  }

  .event-title {
    color: #ffffff;
    font-size: clamp(34px, 5vw, 96px);
    font-weight: 900;
    letter-spacing: 0.06em;
    line-height: 1.1;

    text-shadow:
      0 3px 8px rgba(0, 28, 60, 0.85),
      0 0 20px rgba(0, 28, 60, 0.55);
  }

  .event-subtitle {
    color: #ffffff;
    font-size: clamp(16px, 1.8vw, 34px);
    font-weight: 700;
    letter-spacing: 0.13em;

    margin-top: 1vh;

    text-shadow:
      0 2px 7px rgba(0, 28, 60, 0.85);
  }

  /*
   * Tanzfelder – 60 % Bildschirmbreite.
   */

  .dance-area {
    width: 60%;
    max-width: 1100px;

    margin-left: auto;
    margin-right: auto;

    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    gap: 1.5vh;
  }

  .panel {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: var(--white);

    border: 2px solid var(--gold);
    border-radius: 16px;

    box-shadow:
      0 5px 18px rgba(0, 40, 85, 0.25);

    text-align: center;
  }

  .label {
    color: var(--blue);
    font-weight: 800;

    font-size: clamp(13px, 1.35vw, 25px);
    letter-spacing: 0.18em;
  }

  .dance-name {
    color: var(--dark-blue);
    font-weight: 900;

    text-transform: uppercase;
    line-height: 1.08;

    overflow-wrap: anywhere;
    max-width: 100%;
  }

  /*
   * Aktueller Tanz.
   */

  .current {
    flex: 1.05;
    padding: 1vh 2vw;
  }

  .current .dance-name {
    font-size: clamp(27px, 3.4vw, 65px);
    margin-top: 1vh;
  }

  /*
   * Nächste zwei Tänze.
   */

  .next-row {
    flex: 1;
    min-height: 0;

    display: grid;

    grid-template-columns:
      minmax(0, 1fr) minmax(0, 1fr);

    gap: 1.5vw;
  }

  .next {
    padding: 1vh 1vw;
  }

  .next .dance-name {
    font-size: clamp(20px, 2.1vw, 40px);
    margin-top: 0.8vh;
  }

  /*
   * Kleinere Bildschirmhöhen.
   */

  @media (max-height: 650px) {

    .top-space {
      flex-basis: 45%;
    }

    .screen {
      padding-bottom: 2vh;
    }

    .current .dance-name {
      font-size: clamp(24px, 3vw, 55px);
    }

    .next .dance-name {
      font-size: clamp(18px, 1.9vw, 35px);
    }
  }

  /*
   * Schmale Bildschirme.
   */

  @media (max-width: 800px) {

    .dance-area {
      width: 88%;
    }

    .top-space {
      flex-basis: 42%;
    }

    .event-title {
      font-size: clamp(26px, 5vw, 46px);
    }

    .event-subtitle {
      font-size: clamp(13px, 2.3vw, 20px);
    }

    .label {
      font-size: clamp(11px, 2.2vw, 18px);
    }

    .current .dance-name {
      font-size: clamp(22px, 4.2vw, 40px);
    }

    .next .dance-name {
      font-size: clamp(14px, 2.6vw, 25px);
    }

    .panel {
      border-radius: 12px;
    }
  }
</style>
</head>

<body>

<main class="screen">

  <!-- Veranstaltungstitel -->

  <div class="top-space">

    <div class="event-title">
      GRIECHISCHER ABEND
    </div>

    <div class="event-subtitle">
      KALÓS ÍRTHATE · WILLKOMMEN
    </div>

  </div>

  <!-- Tanzanzeige -->

  <div class="dance-area">

    <section class="panel current">

      <div class="label">
        NOW DANCING
      </div>

      <div class="dance-name" id="aktuell">
        Verbindung wird vorbereitet ...
      </div>

    </section>

    <div class="next-row">

      <section class="panel next">

        <div class="label">
          UP NEXT
        </div>

        <div class="dance-name" id="tanz2">
          –
        </div>

      </section>

      <section class="panel next">

        <div class="label">
          COMING SOON
        </div>

        <div class="dance-name" id="tanz3">
          –
        </div>

      </section>

    </div>

  </div>

</main>

<script>

  /*
   * Bestehende funktionierende FRET-Verbindung.
   * Unverändert übernommen.
   */

  const FRET_URL =
    "https://www.line-dance-stuttgart.de/_functions/tapasLive";

  let aktualisierungLaeuft = false;

  /*
   * Tanznamen anzeigen.
   */

  function zeigeTaenze(daten) {

    document.getElementById("aktuell").textContent =
      daten.aktuell || "NO DANCE SELECTED";

    const naechste = Array.isArray(daten.naechste)
      ? daten.naechste
      : [];

    document.getElementById("tanz2").textContent =
      naechste[0] || "–";

    document.getElementById("tanz3").textContent =
      naechste[1] || "–";
  }

  /*
   * Daten automatisch laden.
   */

  async function aktualisiereTaenze() {

    if (aktualisierungLaeuft) return;

    aktualisierungLaeuft = true;

    try {

      const antwort = await fetch(FRET_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (!antwort.ok) {
        throw new Error(
          "FRET-Verbindung: HTTP " + antwort.status
        );
      }

      const daten = await antwort.json();

      if (daten.fehler) {
        throw new Error(daten.fehler);
      }

      zeigeTaenze(daten);

    } catch (fehler) {

      console.error(
        "Fehler beim Laden der FRET-Tanzdaten:",
        fehler
      );

      /*
       * Zuletzt geladene Tanznamen
       * bleiben weiterhin sichtbar.
       */

    } finally {

      aktualisierungLaeuft = false;

    }
  }

  /*
   * Beim Öffnen sofort laden.
   */

  aktualisiereTaenze();

  /*
   * Alle drei Sekunden aktualisieren.
   */

  setInterval(aktualisiereTaenze, 3000);

</script>

</body>
</html>
