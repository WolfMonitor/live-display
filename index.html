
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tapas – Live Dance Display</title>

<style>
  :root {
    --cream: rgba(255, 248, 233, 0.96);
    --red: #9e2e1b;
    --brown: #69402b;
    --gold: #d7a354;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #f7e5c5;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;

    padding: 0 4vw 3vh;

    background-image:
      url("https://static.wixstatic.com/media/266187_5c6f89cf151849518f459d37bc21f56f~mv2.png");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  /*
   * Größerer Freiraum für den vollständigen
   * TAPAS-Schriftzug samt Untertitel.
   */
  .top-space {
    flex: 0 0 48%;
    min-height: 0;
  }

  .dance-area {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 1.5vh;
  }

  .panel {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: var(--cream);
    border: 2px solid var(--gold);
    border-radius: 16px;

    box-shadow:
      0 5px 18px rgba(85, 43, 20, 0.17);

    text-align: center;
  }

  .label {
    color: var(--brown);
    font-weight: 800;
    font-size: clamp(13px, 1.35vw, 25px);
    letter-spacing: 0.18em;
  }

  .dance-name {
    color: var(--red);
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.08;
    overflow-wrap: anywhere;
    max-width: 100%;
  }

  .current {
    flex: 1.05;
    padding: 1vh 3vw;
  }

  .current .dance-name {
    font-size: clamp(27px, 4.1vw, 78px);
    margin-top: 1vh;
  }

  .next-row {
    flex: 1;
    min-height: 0;

    display: grid;
    grid-template-columns:
      minmax(0, 1fr) minmax(0, 1fr);

    gap: 1.8vw;
  }

  .next {
    padding: 1vh 2vw;
  }

  .next .dance-name {
    font-size: clamp(20px, 2.6vw, 48px);
    margin-top: 0.8vh;
  }

  @media (max-height: 650px) {
    .top-space {
      flex-basis: 45%;
    }

    .screen {
      padding-bottom: 2vh;
    }

    .current .dance-name {
      font-size: clamp(24px, 3.7vw, 65px);
    }

    .next .dance-name {
      font-size: clamp(18px, 2.3vw, 40px);
    }
  }

  @media (max-width: 650px) {
    .top-space {
      flex-basis: 40%;
    }

    .label {
      font-size: clamp(11px, 2.5vw, 18px);
    }

    .current .dance-name {
      font-size: clamp(22px, 4.8vw, 40px);
    }

    .next .dance-name {
      font-size: clamp(14px, 3vw, 25px);
    }

    .panel {
      border-radius: 12px;
    }
  }
</style>
</head>

<body>

<main class="screen">

  <!-- Platz für TAPAS und den vollständigen Untertitel -->
  <div class="top-space"></div>

  <div class="dance-area">

    <section class="panel current">
      <div class="label">NOW DANCING</div>
      <div class="dance-name" id="aktuell">
        Verbindung wird vorbereitet ...
      </div>
    </section>

    <div class="next-row">

      <section class="panel next">
        <div class="label">UP NEXT</div>
        <div class="dance-name" id="tanz2">–</div>
      </section>

      <section class="panel next">
        <div class="label">COMING SOON</div>
        <div class="dance-name" id="tanz3">–</div>
      </section>

    </div>

  </div>

</main>

<script>
  // Bestehende funktionierende FRET-Verbindung
  const FRET_URL =
    "https://www.line-dance-stuttgart.de/_functions/tapasLive";

  let aktualisierungLaeuft = false;

  function zeigeTaenze(daten) {
    document.getElementById("aktuell").textContent =
      daten.aktuell || "NO DANCE SELECTED";

    const naechste = Array.isArray(daten.naechste)
      ? daten.naechste
      : [];

    document.getElementById("tanz2").textContent =
      naechste[0] || "–";

    document.getElementById("tanz3").textContent =
      naechste[1] || "–";
  }

  async function aktualisiereTaenze() {
    if (aktualisierungLaeuft) return;

    aktualisierungLaeuft = true;

    try {
      const antwort = await fetch(FRET_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (!antwort.ok) {
        throw new Error(
          "FRET-Verbindung: HTTP " + antwort.status
        );
      }

      const daten = await antwort.json();

      if (daten.fehler) {
        throw new Error(daten.fehler);
      }

      zeigeTaenze(daten);

    } catch (fehler) {
      console.error(
        "Fehler beim Laden der FRET-Tanzdaten:",
        fehler
      );

      // Bereits geladene Tanznamen bleiben sichtbar.

    } finally {
      aktualisierungLaeuft = false;
    }
  }

  // Sofort laden
  aktualisiereTaenze();

  // Automatisch alle 3 Sekunden aktualisieren
  setInterval(aktualisiereTaenze, 3000);
</script>

</body>
</html>
