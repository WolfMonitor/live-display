
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tapas – Live Dance Display</title>

<style>
  :root {
    --cream: #fff7e8;
    --red: #9e2e1b;
    --brown: #69402b;
    --gold: #d7a354;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #f7e5c5;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 4vw 4vh;

    background-image:
      url("https://static.wixstatic.com/media/266187_d596ee7db9e24f73ae12bd2886f7d303~mv2.png");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  /*
   * Der TAPAS-Schriftzug befindet sich bereits
   * in der vorhandenen Hintergrundgrafik.
   * Deshalb kein zweiter HTML-Titel.
   */
  .top-space {
    flex: 0 0 39vh;
  }

  .dance-area {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 1.8vh;
  }

  .panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: var(--cream);
    border: 2px solid var(--gold);
    border-radius: 18px;

    box-shadow:
      0 5px 18px rgba(85, 43, 20, 0.17);

    text-align: center;
  }

  .label {
    color: var(--brown);
    font-weight: 800;
    font-size: clamp(14px, 1.45vw, 27px);
    letter-spacing: 0.20em;
  }

  .dance-name {
    color: var(--red);
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.12;
    overflow-wrap: anywhere;
    max-width: 100%;
  }

  .current {
    flex: 1.15;
    padding: 1.5vh 3vw;
  }

  .current .dance-name {
    font-size: clamp(30px, 4.4vw, 82px);
    margin-top: 1.3vh;
  }

  .next-row {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns:
      minmax(0, 1fr) minmax(0, 1fr);
    gap: 1.8vw;
  }

  .next {
    padding: 1.3vh 2vw;
  }

  .next .dance-name {
    font-size: clamp(21px, 2.75vw, 52px);
    margin-top: 1.2vh;
  }

  @media (max-height: 650px) {
    .top-space {
      flex-basis: 35vh;
    }

    .screen {
      padding-bottom: 3vh;
    }

    .current .dance-name {
      font-size: clamp(26px, 4vw, 72px);
    }

    .next .dance-name {
      font-size: clamp(19px, 2.5vw, 45px);
    }
  }

  @media (max-width: 650px) {
    .top-space {
      flex-basis: 32vh;
    }

    .label {
      font-size: clamp(11px, 2.5vw, 18px);
    }

    .current .dance-name {
      font-size: clamp(23px, 5vw, 42px);
    }

    .next .dance-name {
      font-size: clamp(15px, 3.2vw, 26px);
    }

    .panel {
      border-radius: 12px;
    }
  }
</style>
</head>

<body>

<main class="screen">

  <div class="top-space"></div>

  <div class="dance-area">

    <section class="panel current">
      <div class="label">NOW DANCING</div>
      <div class="dance-name" id="aktuell">
        Verbindung wird vorbereitet ...
      </div>
    </section>

    <div class="next-row">

      <section class="panel next">
        <div class="label">UP NEXT</div>
        <div class="dance-name" id="tanz2">–</div>
      </section>

      <section class="panel next">
        <div class="label">COMING SOON</div>
        <div class="dance-name" id="tanz3">–</div>
      </section>

    </div>

  </div>

</main>

<script>
  // Bestehende funktionierende FRET-Verbindung
  const FRET_URL =
    "https://www.line-dance-stuttgart.de/_functions/tapasLive";

  let aktualisierungLaeuft = false;

  function zeigeTaenze(daten) {
    document.getElementById("aktuell").textContent =
      daten.aktuell || "NO DANCE SELECTED";

    const naechste = Array.isArray(daten.naechste)
      ? daten.naechste
      : [];

    document.getElementById("tanz2").textContent =
      naechste[0] || "–";

    document.getElementById("tanz3").textContent =
      naechste[1] || "–";
  }

  async function aktualisiereTaenze() {
    if (aktualisierungLaeuft) return;

    aktualisierungLaeuft = true;

    try {
      const antwort = await fetch(FRET_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (!antwort.ok) {
        throw new Error(
          "FRET-Verbindung: HTTP " + antwort.status
        );
      }

      const daten = await antwort.json();

      if (daten.fehler) {
        throw new Error(daten.fehler);
      }

      zeigeTaenze(daten);

    } catch (fehler) {
      console.error(
        "Fehler beim Laden der FRET-Tanzdaten:",
        fehler
      );

      // Bei Verbindungsproblemen bleiben
      // zuletzt geladene Tanznamen sichtbar.

    } finally {
      aktualisierungLaeuft = false;
    }
  }

  aktualisiereTaenze();

  // Automatische Aktualisierung alle 3 Sekunden
  setInterval(aktualisiereTaenze, 3000);
</script>

</body>
</html>
