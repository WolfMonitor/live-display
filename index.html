
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tapas – Live Dance Display</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #f4d6a3;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 3vh 4vw 5vh;

    background-image:
      linear-gradient(
        rgba(255, 246, 222, 0.10),
        rgba(255, 246, 222, 0.10)
      ),
      url("https://static.wixstatic.com/media/266187_d596ee7db9e24f73ae12bd2886f7d303~mv2.png");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .header {
    align-self: center;
    text-align: center;
    padding: 1.5vh 4vw;
    border-radius: 20px;
    background: rgba(255, 245, 220, .94);
    box-shadow: 0 5px 22px rgba(80, 30, 10, .20);
  }

  .title {
    font-size: clamp(40px, 6vw, 110px);
    line-height: 1;
    font-weight: 900;
    color: #ae2c17;
    letter-spacing: .03em;
  }

  .subtitle {
    margin-top: 1vh;
    font-size: clamp(15px, 1.6vw, 30px);
    font-weight: 800;
    color: #62361e;
    text-transform: uppercase;
    letter-spacing: .12em;
  }

  .dance-area {
    width: 100%;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 2.5vh;
  }

  .panel {
    min-width: 0;
    background: rgba(31, 35, 44, .96);
    border: 3px solid #f1c27a;
    border-radius: 22px;
    box-shadow: 0 8px 28px rgba(35, 20, 10, .28);
    text-align: center;
  }

  .label {
    color: #f5ca83;
    font-weight: 800;
    letter-spacing: .18em;
    font-size: clamp(16px, 1.8vw, 34px);
  }

  .dance-name {
    color: white;
    font-weight: 900;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    line-height: 1.12;
  }

  .current {
    min-height: 26vh;
    padding: 2vh 3vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .current .dance-name {
    font-size: clamp(32px, 5vw, 95px);
    margin-top: 2vh;
  }

  .next-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 2vw;
  }

  .next {
    min-height: 21vh;
    padding: 2vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .next .dance-name {
    font-size: clamp(23px, 3vw, 58px);
    margin-top: 1.5vh;
  }
</style>
</head>

<body>

<main class="screen">

  <header class="header">
    <div class="title">TAPAS</div>
    <div class="subtitle">
      Eine kulinarische Weltreise
    </div>
  </header>

  <div class="dance-area">

    <section class="panel current">
      <div class="label">NOW DANCING</div>
      <div class="dance-name" id="aktuell">
        Verbindung wird vorbereitet ...
      </div>
    </section>

    <div class="next-row">

      <section class="panel next">
        <div class="label">UP NEXT</div>
        <div class="dance-name" id="tanz2">–</div>
      </section>

      <section class="panel next">
        <div class="label">COMING SOON</div>
        <div class="dance-name" id="tanz3">–</div>
      </section>

    </div>

  </div>

</main>

<script>

  // Öffentliche FRET-Schnittstelle über Wix
  const FRET_URL =
    "https://www.line-dance-stuttgart.de/_functions/tapasLive";

  let aktualisierungLaeuft = false;

  // Tanznamen auf der Leinwand anzeigen
  function zeigeTaenze(daten) {

    document.getElementById("aktuell").textContent =
      daten.aktuell || "NO DANCE SELECTED";

    const naechste = Array.isArray(daten.naechste)
      ? daten.naechste
      : [];

    document.getElementById("tanz2").textContent =
      naechste[0] || "–";

    document.getElementById("tanz3").textContent =
      naechste[1] || "–";
  }

  // Aktuelle Tanzdaten abrufen
  async function aktualisiereTaenze() {

    if (aktualisierungLaeuft) {
      return;
    }

    aktualisierungLaeuft = true;

    try {

      const antwort = await fetch(FRET_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (!antwort.ok) {
        throw new Error(
          "FRET-Verbindung: HTTP " + antwort.status
        );
      }

      const daten = await antwort.json();

      if (daten.fehler) {
        throw new Error(daten.fehler);
      }

      zeigeTaenze(daten);

    } catch (fehler) {

      console.error(
        "Fehler beim Laden der FRET-Tanzdaten:",
        fehler
      );

      // Bei Verbindungsproblemen bleiben die
      // zuletzt geladenen Tanznamen sichtbar.

    } finally {

      aktualisierungLaeuft = false;

    }
  }

  // Sofort beim Öffnen aktualisieren
  aktualisiereTaenze();

  // Danach automatisch alle 3 Sekunden
  setInterval(aktualisiereTaenze, 3000);

</script>

</body>
</html>
