
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tapas – Live Dance Display</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #f4d6a3;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 2.5vh 4vw 5vh;

    background-image:
      url("https://static.wixstatic.com/media/266187_d596ee7db9e24f73ae12bd2886f7d303~mv2.png");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  /*
   * Freiraum für den TAPAS-Schriftzug,
   * der bereits im Hintergrundbild steht.
   */
  .top-space {
    height: 29vh;
    flex-shrink: 0;
  }

  .dance-area {
    width: 100%;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2vh;
  }

  .panel {
    min-width: 0;
    background: #252932;
    border: 3px solid #e9bd76;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(30, 20, 10, 0.28);
    text-align: center;
  }

  .label {
    color: #f5ca83;
    font-weight: 800;
    letter-spacing: 0.18em;
    font-size: clamp(15px, 1.7vw, 32px);
  }

  .dance-name {
    color: #ffffff;
    font-weight: 900;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    line-height: 1.12;
  }

  .current {
    min-height: 0;
    flex: 1.2;
    padding: 2vh 3vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .current .dance-name {
    font-size: clamp(30px, 4.6vw, 88px);
    margin-top: 1.5vh;
  }

  .next-row {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 2vw;
  }

  .next {
    min-height: 0;
    padding: 1.5vh 2vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .next .dance-name {
    font-size: clamp(22px, 2.8vw, 54px);
    margin-top: 1.5vh;
  }

  /*
   * Anpassung für Monitore mit
   * geringerer Bildschirmhöhe.
   */
  @media (max-height: 600px) {
    .top-space {
      height: 25vh;
    }

    .dance-area {
      gap: 1.5vh;
    }

    .current .dance-name {
      font-size: clamp(25px, 4vw, 70px);
    }

    .next .dance-name {
      font-size: clamp(20px, 2.5vw, 45px);
    }
  }
</style>
</head>

<body>

<main class="screen">

  <!-- Platz für das TAPAS-Motiv im Hintergrund -->
  <div class="top-space"></div>

  <div class="dance-area">

    <section class="panel current">
      <div class="label">NOW DANCING</div>
      <div class="dance-name" id="aktuell">
        Verbindung wird vorbereitet ...
      </div>
    </section>

    <div class="next-row">

      <section class="panel next">
        <div class="label">UP NEXT</div>
        <div class="dance-name" id="tanz2">–</div>
      </section>

      <section class="panel next">
        <div class="label">COMING SOON</div>
        <div class="dance-name" id="tanz3">–</div>
      </section>

    </div>

  </div>

</main>

<script>

  // Bestehende funktionierende FRET-Verbindung
  const FRET_URL =
    "https://www.line-dance-stuttgart.de/_functions/tapasLive";

  let aktualisierungLaeuft = false;

  function zeigeTaenze(daten) {

    document.getElementById("aktuell").textContent =
      daten.aktuell || "NO DANCE SELECTED";

    const naechste = Array.isArray(daten.naechste)
      ? daten.naechste
      : [];

    document.getElementById("tanz2").textContent =
      naechste[0] || "–";

    document.getElementById("tanz3").textContent =
      naechste[1] || "–";
  }

  async function aktualisiereTaenze() {

    if (aktualisierungLaeuft) {
      return;
    }

    aktualisierungLaeuft = true;

    try {

      const antwort = await fetch(FRET_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (!antwort.ok) {
        throw new Error(
          "FRET-Verbindung: HTTP " + antwort.status
        );
      }

      const daten = await antwort.json();

      if (daten.fehler) {
        throw new Error(daten.fehler);
      }

      zeigeTaenze(daten);

    } catch (fehler) {

      console.error(
        "Fehler beim Laden der FRET-Tanzdaten:",
        fehler
      );

      // Die zuletzt geladenen Tanznamen
      // bleiben bei Verbindungsproblemen sichtbar.

    } finally {

      aktualisierungLaeuft = false;

    }
  }

  // Beim Öffnen sofort laden
  aktualisiereTaenze();

  // Alle drei Sekunden aktualisieren
  setInterval(aktualisiereTaenze, 3000);

</script>

</body>
</html>
